[package]
name = "game-r"
version = "0.1.0"
edition = "2024"

[lib]
name = "main"
crate-type = ["cdylib"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "DedicatedWorkerGlobalScope",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Performance",
] }
wasm-bindgen-futures = "0.4.56"
console_error_panic_hook = "0.1.7"
rand = "0.9.2"
rcade-plugin-input-classic = "0.2"
rcade-plugin-input-spinners = { git = "https://github.com/cysabi/RCade", rev = "b74806c18cf218d10cbbf4f7602bdc16ef92dfee" }
bevy = { version = "0.17.3", default-features = false, features = ["zstd_rust", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_asset", "bevy_scene", "bevy_window", "bevy_sprite", "bevy_sprite_render", "bevy_log", "tonemapping_luts", "webgl2", "dynamic_linking"] }
raw-window-handle = { version = "0.6.2", default-features = false }
gloo-timers = { version = "0.3.0", features = ["futures"] }
wgpu = { version = "26.0.1", features = ["webgl"] }
log = { version = "*", features = ["max_level_info", "release_max_level_warn"] }
roxmltree = "0.21.1"
anyhow = "1.0.104"
